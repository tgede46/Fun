[[permission]]
identifier = "allow-get-recent-projects"
description = "Charge la liste des projets récents."
commands.allow = ["get_recent_projects"]

[[permission]]
identifier = "allow-open-project"
description = "Ouvre un dossier projet et initialise `.fun/`."
commands.allow = ["open_project"]

[[permission]]
identifier = "allow-pick-project-folder"
description = "Affiche le sélecteur natif de dossier."
commands.allow = ["pick_project_folder"]

[[permission]]
identifier = "allow-pick-project-parent-folder"
description = "Choisit l'emplacement d'un nouveau projet."
commands.allow = ["pick_project_parent_folder"]

[[permission]]
identifier = "allow-create-project"
description = "Crée un dossier projet et initialise `.fun/`."
commands.allow = ["create_project"]

[[permission]]
identifier = "allow-create-diagram"
description = "Crée un diagramme Excalidraw vide sous `.fun/diagrams/`."
commands.allow = ["create_diagram"]

[[permission]]
identifier = "allow-load-diagram"
description = "Charge le JSON d'un diagramme Excalidraw."
commands.allow = ["load_diagram"]

[[permission]]
identifier = "allow-save-diagram"
description = "Persiste le JSON d'un diagramme Excalidraw."
commands.allow = ["save_diagram"]

[[permission]]
identifier = "allow-list-diagrams"
description = "Liste les diagrammes du projet."
commands.allow = ["list_diagrams"]

[[permission]]
identifier = "allow-get-project-settings"
description = "Lit les paramètres du projet."
commands.allow = ["get_project_settings"]

[[permission]]
identifier = "allow-set-project-theme"
description = "Persiste le thème atelier dans settings.json."
commands.allow = ["set_project_theme"]
