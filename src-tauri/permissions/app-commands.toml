[[permission]]
identifier = "allow-get-recent-projects"
description = "Charge la liste des projets récents."
commands.allow = ["get_recent_projects"]

[[permission]]
identifier = "allow-open-project"
description = "Ouvre un dossier projet et initialise `.fun/`."
commands.allow = ["open_project"]

[[permission]]
identifier = "allow-pick-project-folder"
description = "Affiche le sélecteur natif de dossier."
commands.allow = ["pick_project_folder"]

[[permission]]
identifier = "allow-pick-project-parent-folder"
description = "Choisit l'emplacement d'un nouveau projet."
commands.allow = ["pick_project_parent_folder"]

[[permission]]
identifier = "allow-export-text-file"
description = "Exporte un diagramme via le dialogue d'enregistrement natif."
commands.allow = ["export_text_file"]

[[permission]]
identifier = "allow-create-project"
description = "Crée un dossier projet et initialise `.fun/`."
commands.allow = ["create_project"]

[[permission]]
identifier = "allow-create-diagram"
description = "Crée un diagramme Excalidraw vide sous `.fun/diagrams/`."
commands.allow = ["create_diagram", "create_diagram_of_kind", "create_diagram_with_content"]

[[permission]]
identifier = "allow-create-drawio-diagram"
description = "Crée un diagramme draw.io vide sous `.fun/diagrams/`."
commands.allow = ["create_drawio_diagram"]

[[permission]]
identifier = "allow-generate-diagram-from-image"
description = "Génère un diagramme depuis une image via un modèle vision gratuit."
commands.allow = ["generate_diagram_from_image"]

[[permission]]
identifier = "allow-load-diagram"
description = "Charge le JSON d'un diagramme Excalidraw."
commands.allow = ["load_diagram"]

[[permission]]
identifier = "allow-save-diagram"
description = "Persiste le JSON d'un diagramme Excalidraw."
commands.allow = ["save_diagram"]

[[permission]]
identifier = "allow-list-diagrams"
description = "Liste les diagrammes du projet."
commands.allow = ["list_diagrams"]

[[permission]]
identifier = "allow-delete-diagram"
description = "Supprime un fichier diagramme Excalidraw."
commands.allow = ["delete_diagram"]

[[permission]]
identifier = "allow-get-project-settings"
description = "Lit les paramètres du projet."
commands.allow = ["get_project_settings"]

[[permission]]
identifier = "allow-set-project-theme"
description = "Persiste le thème atelier dans settings.json."
commands.allow = ["set_project_theme"]

[[permission]]
identifier = "allow-set-companion-position"
description = "Persiste la position d'un compagnon flottant."
commands.allow = ["set_companion_position"]

[[permission]]
identifier = "allow-set-lofi-prefs"
description = "Persiste mute et volume de l'ambiance Souffle."
commands.allow = ["set_lofi_prefs"]

[[permission]]
identifier = "allow-get-openrouter-key-configured"
description = "Indique si une clé OpenRouter est enregistrée."
commands.allow = ["get_openrouter_key_configured"]

[[permission]]
identifier = "allow-get-ai-status"
description = "Lit le statut IA (clé configurée, modèle actif)."
commands.allow = ["get_ai_status"]

[[permission]]
identifier = "allow-send-chat-message"
description = "Envoie un message au Chat IA."
commands.allow = ["send_chat_message"]

[[permission]]
identifier = "allow-reset-diagram"
description = "Réinitialise le diagramme courant."
commands.allow = ["reset_diagram"]

[[permission]]
identifier = "allow-generate-diagram-from-code"
description = "Génère un diagramme UML depuis le code."
commands.allow = ["generate_diagram_from_code"]

[[permission]]
identifier = "allow-set-pomodoro-durations"
description = "Persiste les durées Pomodoro."
commands.allow = ["set_pomodoro_durations"]

[[permission]]
identifier = "allow-notify-pomodoro-phase"
description = "Notification OS fin de phase Pomodoro."
commands.allow = ["notify_pomodoro_phase"]

[[permission]]
identifier = "allow-notify-chat-complete"
description = "Notification OS fin de réponse chat IA."
commands.allow = ["notify_chat_complete"]

[[permission]]
identifier = "notification:allow-is-permission-granted"
description = "Vérifier l'état de permission de notification."
commands.allow = ["is_permission_granted"]

[[permission]]
identifier = "allow-run-benchmark"
description = "Lance le benchmark IA et met à jour le modèle actif."
commands.allow = ["run_benchmark"]
